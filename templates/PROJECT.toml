organization_change = ""
conditional = "decide AI/analytics/cost/compliance/handover applicability"

[native_truth]
api = []
database = []
containers = []
infrastructure = []
ci_cd = []
design = []
dependencies = []
tests = []
ai = []

[unknowns]
