openapi: 3.0.3
info:
  title: Mini Ticket Triage API
  version: 1.0.0
paths:
  /tickets:
    post:
      responses:
        '201':
          description: Ticket created (persisted before any AI call)
  /tickets/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ticket state including suggestion and final classification
  /tickets/{id}/confirm:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Human confirmed or overrode the suggestion; actor and timestamp recorded
